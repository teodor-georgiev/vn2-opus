name: ChatGPT VN2 8-week WAPE probe

on:
  push:
    branches:
      - feat/vn2-8w-wape-probe
    paths:
      - ".github/workflows/chatgpt-vn2-8w-wape-probe.yml"
      - "experiments/vn2_8w_wape_probe.py"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip pandas numpy lightgbm

      - name: Run leakage-safe 8-week WAPE benchmark
        run: python experiments/vn2_8w_wape_probe.py

      - name: Publish result artifact
        uses: actions/upload-artifact@v4
        with:
          name: vn2-8w-wape-results
          path: artifacts/vn2_8w_wape_results.json
          if-no-files-found: error
