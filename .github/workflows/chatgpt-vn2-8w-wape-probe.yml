name: ChatGPT VN2 8-week WAPE probe

on:
  push:
    branches:
      - feat/vn2-8w-wape-probe
    paths:
      - ".github/workflows/chatgpt-vn2-8w-wape-probe.yml"
      - "experiments/vn2_8w_wape_probe.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chatgpt-vn2-8w-wape-probe.yml"
      - "experiments/vn2_8w_wape_probe.py"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4
        with:
          ref: feat/vn2-8w-wape-probe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn lightgbm

      - name: Run leakage-safe 8-week WAPE benchmark
        run: python experiments/vn2_8w_wape_probe.py

      - name: Publish result artifact
        uses: actions/upload-artifact@v4
        with:
          name: vn2-8w-wape-results
          path: artifacts/vn2_8w_wape_results.json
          if-no-files-found: error

      - name: Persist result on benchmark branch
        if: github.event_name == 'push'
        run: |
          git config user.name "chatgpt-benchmark"
          git config user.email "noreply@users.noreply.github.com"
          git add -f artifacts/vn2_8w_wape_results.json
          git diff --cached --quiet && exit 0
          git commit -m "Record VN2 8-week WAPE probe result"
          git push origin HEAD:feat/vn2-8w-wape-probe
